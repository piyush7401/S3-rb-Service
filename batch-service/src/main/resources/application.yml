app:
  s3rb-service:
    base-url: http://localhost:8080
  s3:
    mode: aws
  sqs:
    enabled: true
    queue-name: https://sqs.ap-south-1.amazonaws.com/582377792951/s3-rb-events

spring:
  main:
    web-application-type: none
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
  cloud:
    aws:
      region:
        static: ap-south-1
